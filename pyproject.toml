[build-system]
requires = ["setuptools>=70", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligest"
version = "0.1.0"
description = "Pipeline reproducible de clasificación de gestos, ONNX y aplicación de escritorio."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Luis Felipe"}]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
inference = [
  "onnxruntime==1.18.1",
  "opencv-python==4.10.0.84",
  "matplotlib>=3.7.0",
]
desktop = [
  "onnxruntime==1.18.1",
  "opencv-python==4.10.0.84",
  "PySide6==6.6.3",
  "matplotlib>=3.7.0",
]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
intelligest = "intelligest.cli:main"
intelligest-desktop = "intelligest.app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
